[package]
name = "ferreal-build"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Ferreal's build-script half: reads a crate's Unreal-facing items and writes the C++ of its UCLASSes into an Unreal module"

[dependencies]
ferreal-model.workspace = true
syn.workspace = true
quote.workspace = true
# Line and column numbers in error messages outside of macros.
proc-macro2 = { workspace = true, features = ["span-locations"] }
# The engine's reflection data (engine.rs).
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
