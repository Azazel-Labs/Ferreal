[workspace]
resolver = "3"
members = ["ferreal", "ferreal-model", "ferreal-macros", "ferreal-build", "tests/hello/rust", "tests/hello/types", "xtask"]
# The example game's Rust plugin: a workspace of its own, built by its Unreal module against
# the engine it is built in.
exclude = ["examples/UnrealGame/Plugins/FerrealSample/Rust"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
ferreal = { path = "ferreal", version = "0.1.0" }
ferreal-model = { path = "ferreal-model", version = "0.1.0" }
ferreal-macros = { path = "ferreal-macros", version = "0.1.0" }
ferreal-build = { path = "ferreal-build", version = "0.1.0" }
syn = { version = "2", features = ["full", "extra-traits", "visit"] }
quote = "1"
proc-macro2 = "1"

# Unreal plugins build their Rust with this profile (the Build.cs template passes it):
# optimized, with unwinding, so a panic in Rust is caught at the FFI boundary and logged
# instead of taking the editor down.
[profile.unreal]
inherits = "release"
panic = "unwind"
debug = "line-tables-only"

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
